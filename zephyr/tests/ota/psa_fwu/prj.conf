CONFIG_ZTEST=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZCBOR=y
CONFIG_BINDESC=y
CONFIG_BINDESC_DEFINE=y
CONFIG_MAIN_STACK_SIZE=4096

# Coordinator fixtures keep a complete update and worker job on the test stack.
# Cortex-M3's 1 KiB ztest default is smaller than those frames alone.
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
