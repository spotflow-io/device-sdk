CONFIG_SPOTFLOW_USE_ETH=y
CONFIG_SPOTFLOW_DEVICE_ID="pic32ck_gc01_cult"

# Required by the current Zephyr mbedTLS 4 configuration.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# Use the PIC32CK hardware TRNG, not the sample's fallback legacy RNG.
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y

#  Store coredumps in .noinit RAM instead of flash on PIC32CK GC01.

#   Zephyr disables interrupts before collecting a coredump. The PIC32CK G3
#   flash driver waits for an FCW completion interrupt during erase/program,
#   so a flash-backed coredump times out in fatal-error context, including
#   crashes from ISRs. The in-memory backend performs no flash operations and
#   is therefore safe in this context.

#  Spotflow performs a warm reboot for the in-memory backend, allowing the
#  .noinit buffer to be uploaded after restart. Dumps are lost on power loss,
#  brownout, or any reset that clears SRAM.

CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY=y
CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY_SIZE=131072
