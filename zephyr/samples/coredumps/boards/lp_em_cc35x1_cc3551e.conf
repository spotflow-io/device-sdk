# Spotflow does not yet auto-detect TI's CC35x1 Wi-Fi devicetree compatible.
CONFIG_SPOTFLOW_USE_WIFI=y
CONFIG_WIFI_TI_CC35XX=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_TI_CC35XX=y

# TI delivers RX bursts from a cooperative transport thread. Process them
# inline so the separate Zephyr RX thread cannot be starved behind that thread.
CONFIG_NET_TC_RX_COUNT=0

# The driver receives standard Ethernet frames, including a 1500-byte payload.
CONFIG_WIFI_TI_CC35XX_MTU=1500

# Legacy PSA RNG initialization requests CC35x entropy before the system workqueue starts,
# but the CC35x entropy driver needs that workqueue to refill its pool.
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y

# The TI downstream's Mbed TLS defaults take precedence over Spotflow's
# configdefault values and are too small to parse the server certificate chain.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4608
CONFIG_MBEDTLS_HEAP_SIZE=36864

# Provide headroom for packets retained by TCP and socket processing.
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64

# Based on TI's CC35x1 Wi-Fi shell reference configuration:
# zephyr/samples/net/wifi/shell/boards/lp_em_cc35x1_cc3551e.conf
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_MAIN_STACK_SIZE=61440
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_DYNAMIC_THREAD_POOL_SIZE=3
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

# A full 1 MiB RAM dump cannot fit in the board's application storage area.
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
