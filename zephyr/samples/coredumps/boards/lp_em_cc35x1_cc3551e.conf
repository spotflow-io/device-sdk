# Spotflow does not yet auto-detect TI's CC35x1 Wi-Fi devicetree compatible.
CONFIG_SPOTFLOW_USE_WIFI=y
CONFIG_WIFI_TI_CC35XX=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_TI_CC35XX=y

# Based on TI's CC35x1 Wi-Fi shell reference configuration:
# zephyr/samples/net/wifi/shell/boards/lp_em_cc35x1_cc3551e.conf
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_MAIN_STACK_SIZE=61440
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_DYNAMIC_THREAD_POOL_SIZE=3
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

# A full 1 MiB RAM dump cannot fit in the board's application storage area.
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
