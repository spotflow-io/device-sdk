# Use the hardware TRNG. The legacy RNG seeds before this board's POST_KERNEL
# entropy driver is ready, causing PSA initialization to fail.
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y

# The NVMCTRL flash driver takes a mutex, which cannot be used when the button
# triggers a fatal error in interrupt context. Keep the dump in .noinit RAM.
CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY=y
CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY_SIZE=65536
