# This value isn't propagated from Spotflow Kconfig on Nordic boards, so it must be set manually
# at least to 512 (minimal value necessary to validate the MQTT broker certificate)
CONFIG_MBEDTLS_MPI_MAX_SIZE=512

# Spotflow's MQTT/TLS transport still uses the legacy mbedTLS configuration symbols. NCS 3.2.4
# defaults non-secure nRF5340 applications to PSA-only crypto, so explicitly enable the compatibility
# layer until the transport is fully migrated to PSA.
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
