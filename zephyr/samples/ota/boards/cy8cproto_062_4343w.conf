# No hardware random number generator is available on this board by default.
CONFIG_TEST_RANDOM_GENERATOR=y

# The PSoC6 flash driver writes 512-byte rows (erase value 0x00). imgtool's
# CLI cannot emit max-align=512 trailers, so the default signing pass is only a
# placeholder: scripts/psoc6_resign.py rewrites zephyr.signed.{bin,hex} with
# the correct trailer (see CMakeLists.txt). OVERWRITE_ONLY keeps the stock
# imgtool invocation from passing --align 512 (rejected by the CLI).
CONFIG_MCUBOOT_IMGTOOL_OVERWRITE_ONLY=y
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--load-addr 0x08000000 --hex-addr 0x10020000"
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y

# ROM_START_OFFSET stays 0x200 under BOOTLOADER_MCUBOOT (not user-settable).
# CMakeLists.txt pads the remaining 0x1E00 so vectors are at 0x08002000 and
# scripts/psoc6_resign.py uses --header-size 0x2000 to match.

# The application needs the active slot from MCUboot so it writes an update to
# the other slot.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y

# The Armv7-M MPU rounds the approximately 790 KiB RAM-loaded image up to a
# 1 MiB region, leaving no room for runtime data.
CONFIG_ARM_MPU=n

# Preserve enough RAM for the OTA-focused sample by omitting optional metrics.
CONFIG_SPOTFLOW_METRICS=n
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=n
CONFIG_SPOTFLOW_METRICS_SYSTEM=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_RESET_CAUSE=n
