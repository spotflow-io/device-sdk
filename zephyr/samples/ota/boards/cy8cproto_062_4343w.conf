# No hardware random number generator is available on this board by default.
CONFIG_TEST_RANDOM_GENERATOR=y

# The PSoC6 flash driver writes 512-byte rows, while imgtool's CLI accepts
# alignment values only through 32. RAM-load updates are unpadded, so this
# changes only imgtool's space calculation. Supply the load address explicitly
# because the overwrite-only signing branch does not add it automatically.
CONFIG_MCUBOOT_IMGTOOL_OVERWRITE_ONLY=y
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--load-addr 0x08000000"

# The application needs the active slot from MCUboot so it writes an update to
# the other slot.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y

# The Armv7-M MPU rounds the approximately 790 KiB RAM-loaded image up to a
# 1 MiB region, leaving no room for runtime data.
CONFIG_ARM_MPU=n

# Preserve enough RAM for the OTA-focused sample by omitting optional metrics.
CONFIG_SPOTFLOW_METRICS=n
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=n
CONFIG_SPOTFLOW_METRICS_SYSTEM=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_RESET_CAUSE=n
