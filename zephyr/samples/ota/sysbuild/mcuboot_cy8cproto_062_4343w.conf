# Share the selected slot with the RAM-loaded application.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_BOOT_SHARE_DATA=y
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y

# MCUboot itself runs from the top 63 KiB of SRAM. Limit the bytes copied from
# an application image to the space below that region; application BSS may
# reclaim MCUboot's RAM after handoff.
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_START=0x08000000
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_SIZE=983040
