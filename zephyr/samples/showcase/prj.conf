# Enable the Spotflow SDK and its MQTT observability features.
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_LOG_BACKEND=y
CONFIG_SPOTFLOW_COREDUMPS=y
CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=y
CONFIG_SPOTFLOW_METRICS_SYSTEM=y
CONFIG_SPOTFLOW_SESSION_METADATA_BUFFER_SIZE=512

# Track only the sample's main thread to demonstrate the selective stack API.
CONFIG_SPOTFLOW_METRICS_SYSTEM_STACK_ALL_THREADS=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_STACK_MAX_THREADS=4

# Enable automatic main-firmware OTA and delegated artifact handling.
CONFIG_SPOTFLOW_OTA=y
CONFIG_SPOTFLOW_OTA_AUTO_HANDLE_MAIN_FIRMWARE=y

# Zephyr logging and coredump contents.
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_DEBUG_COREDUMP_THREADS_METADATA=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y

# The sample button distinguishes short and long presses.
CONFIG_GPIO=y

# Networking requirements shared with the other MQTT samples.
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Persist cloud configuration and OTA state and support MCUboot image writes.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_STREAM_FLASH=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SPOTFLOW_MODULE_DEFAULT_LOG_LEVEL=3
CONFIG_SPOTFLOW_OTA_LOG_LEVEL=4

# This permits development boards without a hardware RNG to connect. Remove it
# in production and use a suitable entropy source instead.
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y
