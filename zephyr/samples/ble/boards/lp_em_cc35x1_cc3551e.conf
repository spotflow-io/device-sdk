CONFIG_BT_DEVICE_NAME="Spotflow Texas Instruments"
CONFIG_SPOTFLOW_DEVICE_ID="ti_cc35x1_cc3551e"

# TI's combined CC35x1 radio driver routes Bluetooth through the Wi-Fi host
# stack, whose Kconfig selections require Zephyr networking to be enabled.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y

# Matches TI's CC35x1 Bluetooth peripheral reference configuration:
# zephyr/samples/bluetooth/peripheral/boards/lp_em_cc35x1_cc3551e.conf
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_MAIN_STACK_SIZE=61440
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_DYNAMIC_THREAD_POOL_SIZE=3
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

# A full 1 MiB RAM dump cannot fit in the board's application storage area.
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
