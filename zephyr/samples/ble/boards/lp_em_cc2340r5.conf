# CC2340R5 has only 36 KiB of SRAM, so this board uses the BLE transport with
# deliberately small queues and buffers. Keep the generic prj.conf useful for
# larger boards and put the CC2340R5 tradeoffs here.

# This sample uses only logs and coredumps, metrics are disabled to save RAM.

CONFIG_BT_DEVICE_NAME="Spotflow Texas Instruments"
CONFIG_SPOTFLOW_DEVICE_ID="testing_device_ti"

# The common sample already enables Spotflow BLE logging. Keep these explicit so
# this board profile remains self-contained if prj.conf changes later.
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_TRANSPORT_BLE=y
CONFIG_SPOTFLOW_LOG_BACKEND=y
CONFIG_SPOTFLOW_COREDUMPS=y

# The TI CC23x0 downstream SoC reboot hook does not implement SYS_REBOOT_COLD.
# Use warm reboot so coredump-triggered fatal errors reset instead of spinning.
CONFIG_SPOTFLOW_COREDUMPS_REBOOT_WARM=y

# Metrics and persisted cloud configuration are disabled to save RAM and flash.
# This can be re-enabled later, but Settings/NVS needs its own storage budget.
CONFIG_SPOTFLOW_METRICS=n
CONFIG_SPOTFLOW_SETTINGS=n

# Spotflow BLE session metadata and coredump IDs use sys_rand32_get(). The board
# disables entropy by default, so enable the CC23x0 entropy source here.
CONFIG_ENTROPY_GENERATOR=y

# This BLE-only sample does not need TLS. The board default enables MbedTLS, but
# TinyCrypt is already present through Bluetooth and is enough for CTR-DRBG.
CONFIG_MBEDTLS=n
CONFIG_CTR_DRBG_CSPRNG_GENERATOR=y

# The CC23x0 entropy driver allocates the radio-noise buffer from the system heap
# during startup. 256 words is the driver-enforced minimum and 64 bytes is enough
# to seed CTR-DRBG for this sample. Increase back to 512/128 if more subsystems
# start consuming raw entropy directly.
CONFIG_ENTROPY_CC23X0_NOISE_INPUT_WORD_LENGTH=256
CONFIG_ENTROPY_CC23X0_ENTROPY_BYTE_LENGTH=64

# The entropy driver's hidden heap minimum is fixed at 3072 bytes even when the
# noise buffer is reduced. Right-size the shared system heap explicitly: enough
# for the 1024-byte startup entropy allocation plus Spotflow's small runtime
# queues. Increase this first if k_malloc failures appear.
CONFIG_HEAP_MEM_POOL_SIZE=2560
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# The Bluetooth host PRNG pulls in extra TinyCrypt HMAC/SHA state. With SMP,
# privacy and bonding disabled, Zephyr's CTR-DRBG-backed random API is enough.
CONFIG_BT_HOST_CRYPTO_PRNG=n

# Keep UART logs for bring-up/debugging. Spotflow still sends logs over BLE; the
# UART backend only adds local visibility. If RAM becomes critical, reduce log
# levels or buffers before disabling UART.
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=768

# The sample main thread only configures GPIO and emits logs. 1024 bytes saves
# RAM compared with the generic sample's 2048. Increase if stack usage reports
# show less than roughly 25 percent headroom.
CONFIG_MAIN_STACK_SIZE=1024

# The Spotflow processor only runs BLE framing and queue draining here, not a TLS
# handshake. 1536 is a conservative reduced value; 1280 may work after measuring
# CONFIG_STACK_USAGE output on the target.
CONFIG_SPOTFLOW_PROCESSING_THREAD_STACK_SIZE=1536

# Two queued Spotflow log messages is enough to absorb short bursts while keeping
# heap usage bounded. Increase to 4 if normal operation drops logs; decrease to 1
# only if occasional log loss is acceptable and RAM is still tight.
CONFIG_SPOTFLOW_LOG_BACKEND_QUEUE_SIZE=2
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_LOGGING=512

# Keep individual log records small. The sample still sends normal short logs,
# but long lines are dropped/truncated by Spotflow rather than consuming RAM.
# 96/192 can be lowered to 64/160 for very short messages, or raised to 128/256
# if real application messages need it.
CONFIG_SPOTFLOW_LOG_BUFFER_SIZE=96
CONFIG_SPOTFLOW_CBOR_LOG_MAX_LEN=192
CONFIG_SPOTFLOW_LOG_INCLUDE_BODY_TEMPLATE=n

# Send INFO/WARNING/ERROR records to Spotflow by default. Set to 2 to send only
# warnings/errors if BLE throughput or heap pressure becomes a problem.
CONFIG_SPOTFLOW_DEFAULT_SENT_LOG_LEVEL=3
CONFIG_SPOTFLOW_MODULE_DEFAULT_LOG_LEVEL=2
CONFIG_SPOTFLOW_LOGS_PROCESSING_LOG_LEVEL=2
CONFIG_SPOTFLOW_COREDUMPS_PROCESSING_LOG_LEVEL=2

# Full RAM dumps do not fit comfortably on this device. Minimal coredumps keep
# the fault context and current stack only, which fits the small flash partition
# and is the practical option for this board.
# CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=n
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_SPOTFLOW_COREDUMPS_THREAD_STACK_SIZE=1024

# 128-byte chunks minimize heap and static RAM. Upload is slower because BLE has
# more fragments, but reliability on 36 KiB SRAM is better than using 512/1024.
CONFIG_SPOTFLOW_COREDUMPS_CHUNK_SIZE=128
CONFIG_SPOTFLOW_COREDUMPS_BACKEND_QUEUE_SIZE=1
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_COREDUMPS=512

# Use the minimum ATT MTU and ACL buffer sizes. Spotflow BLE framing fragments
# larger CBOR messages, so this saves RAM at the cost of throughput.
CONFIG_BT_L2CAP_TX_MTU=23
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_BUF_ACL_TX_COUNT=2
CONFIG_BT_BUF_ACL_RX_COUNT=2

# Trim Bluetooth host features that are not needed by the Spotflow GATT service.
# Re-enable SMP/privacy/settings only if the gateway requires pairing/bonding.
CONFIG_BT_SMP=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n

# Keep HCI event/command buffers near their documented minimums. EVT count 3 is
# a small safety margin over the minimum 2; reducing to 2 is possible if measured.
CONFIG_BT_BUF_EVT_RX_SIZE=68
CONFIG_BT_BUF_EVT_RX_COUNT=3
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_CMD_TX_SIZE=65

# Enable stack measurement helpers while validating this tight RAM profile. They
# can be disabled for production if the extra diagnostics are not wanted.
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_USAGE=y
