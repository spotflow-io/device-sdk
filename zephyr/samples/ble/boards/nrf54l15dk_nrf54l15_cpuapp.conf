CONFIG_BT_DEVICE_NAME="Spotflow nRF54L15"
CONFIG_SPOTFLOW_DEVICE_ID="testing_device_nrf54l15"

# Keep logs and metrics in RRAM while no gateway is connected
CONFIG_SPOTFLOW_PERSISTENT_BUFFER=y
# FCB needs write blocks of at most 8 bytes; with the RRAMC write buffer disabled, RRAM accepts
# 32-bit writes (see write-block-size in nrf54l15dk_nrf54l15_cpuapp.overlay)
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=0

CONFIG_DEBUG_COREDUMP_THREADS_METADATA=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y
