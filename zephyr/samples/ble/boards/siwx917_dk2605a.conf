CONFIG_BT_DEVICE_NAME="Spotflow SiLabs SIWX917"
CONFIG_SPOTFLOW_DEVICE_ID="testing_device_siwx917"

# Flash is controlled by NWP;
# therefore, it is not possible to use it from fault handler
CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY=y
CONFIG_DEBUG_COREDUMP_BACKEND_IN_MEMORY_SIZE=32768
# CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y


CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT_INTERVAL=10
CONFIG_SPOTFLOW_METRICS_SYSTEM=y
# limit the the number of threads to avoid overloading the ble transport with
# metric with too many dimensions
CONFIG_SPOTFLOW_METRICS_SYSTEM_STACK_MAX_THREADS=16
