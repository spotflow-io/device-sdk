# Add with EXTRA_CONF_FILE for OTA-capable boards. Keep the default BLE sample
# usable on devices without persistent storage or firmware-update support.
CONFIG_SPOTFLOW_OTA=y
# Demonstration only: an unattended browser test can connect without pairing.
# Production OTA enables encryption by default; configure trusted pairing there.
CONFIG_SPOTFLOW_BLE_REQUIRE_ENCRYPTION=n
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
