# Boards that support both Wi-Fi and Ethernet use Wi-Fi by default.
# If you want to use Ethernet instead, please use the following option:
# CONFIG_SPOTFLOW_USE_ETH=y

# Enable Spotflow and OTA updates
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_OTA=y

# Let the SDK handle download, PSA installation, and the installation reboot.
CONFIG_SPOTFLOW_OTA_AUTO_HANDLE_MAIN_FIRMWARE=y
CONFIG_SPOTFLOW_OTA_MAIN_FIRMWARE_PSA_FWU=y

# Enable Spotflow reboot and heartbeat metrics, disable others
CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=y
CONFIG_SPOTFLOW_METRICS_SYSTEM=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_HEAP=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_NETWORK=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_CPU=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_CONNECTION=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_RESET_CAUSE=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_STACK=n

# Enable logging
CONFIG_LOG=y

# Show function names in the logs
CONFIG_LOG_FUNC_NAME_PREFIX_INF=y
CONFIG_LOG_FUNC_NAME_PREFIX_WRN=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=y

# Log details of OTA updates for debugging
CONFIG_SPOTFLOW_OTA_LOG_LEVEL=4

# Satisfy networking dependencies of Spotflow
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Enable a persistent settings backend so OTA worker results can be saved and reported.
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Required by automatic main-firmware handling.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Increase main stack size for the sample
CONFIG_MAIN_STACK_SIZE=4096

# Ensures that connection is established even on boards without hardware random number generator.
# We recommend removing this option for production use.
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y

# TI native image packaging, with two vendor slots. Increment for each update.
CONFIG_CC35XXE_FWU=y
CONFIG_CC35XXE_GENERATE_FLASH_MAP_CONFIG=y
CONFIG_CC35XXE_FLASH_PROFILE_IS25WJ032F=y
CONFIG_CC35XXE_VENDOR_IMAGE_VERSION="0.0.1.0"
